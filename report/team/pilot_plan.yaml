# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (co_mau(0.70, 0.75), z = 1,95996 và 0,84162)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48 → 3.103 mỗi nhóm = 42 người/nhóm, tổng 84 > 40: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức 5 điểm
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300, và chỉ 6 cụm (< 20): loại
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (1 + (m − 1) × 0,02) ≥ 859 → m ≥ 299 yêu cầu mỗi người (DE 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   (Cách chia: theo nhân viên, 20 nhân viên trợ lý + 20 nhân viên đối chứng)
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng 12 depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên đối chứng chép câu trả lời của trợ lý trong cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, MDE 6 điểm, 3 luật dừng và decision_date chốt trong file này trước ngày bắt đầu.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm (nhân viên) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chia theo nhân viên 20 + 20 không đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251). Nhóm chấp nhận MDE 6 điểm
#   (859 mỗi nhóm, m ≥ 299 yêu cầu mỗi nhân viên). Bất lợi: nếu tác động thật chỉ 5 điểm thì power còn 0,64
#   (NormalIndPower, n = 859). Giám đốc vận hành phải ký chấp nhận đánh đổi này trước ngày bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: 4,25% (51/1.200), trong phạm vi noi_dia + hang_nang 3,97%.
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên dùng: chênh +2 điểm so với đối chứng hoặc trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated), cả 12 depot; loại quoc_te (1,88×) và doi_tac (0,85×) vẫn do nhân viên tự làm"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 4 → 10 → 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy cùng tuần, cùng depot; bốc thăm bằng code với seed ghi trước, phân tầng theo depot"
    spillover_risk: "Trung bình: chia sẻ câu trả lời trong cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, MDE, 3 luật dừng và decision_date chốt trước ngày bắt đầu, không sửa trong pilot"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên hoặc vượt 6% (hiện tại 3,97% trong phạm vi), hoặc có từ 1 ca hoàn trùng trở lên TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển toàn bộ yêu cầu về nhân viên tự làm KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công trong phạm vi vượt 8.000 đ (gốc 3.414 đ, simulated) hoặc tỉ lệ làm lại vượt 7% (đợt chạy thử 4,89%) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được giữ hang_nang trong pilot"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% (đợt chạy thử 27,12%) hoặc dưới 60% yêu cầu của nhóm trợ lý được mở bằng trợ lý TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày làm việc và báo cáo nguyên nhân KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như trước pilot"
  decision_date: "2027-01-05"     # bắt đầu 2026-12-07, ba bước rollout + một tuần đủ m ≥ 299 mỗi nhân viên
  simulated_inputs:
    - "phut_xem_lai_simulated, phut_lam_lai_simulated (mọi số chi phí có xem lại/làm lại)"
    - "Chi phí mỗi việc thành công trong phạm vi 3.414 đ, cả bộ 4.472 đ (ngưỡng luật dừng chi phí 8.000 đ)"
    - "Tỉ lệ so với 12.000 đ theo loại: noi_dia 0,22×, hang_nang 0,69×, quoc_te 1,88×, doi_tac 0,85×"
    - "Toàn bộ dữ liệu đợt chạy thử (logix_runs.csv, logix_requests.csv) là giả lập: tỉ lệ mở lại 3,97%, làm lại 4,89%, bỏ qua gợi ý 27,12%"
